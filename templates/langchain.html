<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangChain · MarketPulse AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
  <a class="brand" href="index.html">📈 MarketPulse AI</a>
  <div class="nav-links">
    <a class="nav-btn" href="index.html">General</a>
    <a class="nav-btn" href="comparison.html">Comparison</a>
    <a class="nav-btn active" href="agent.html">Agent</a>
  </div>
</div>
<div class="container">
<a class="back-btn" href="agent.html">← Back to Agents</a>
<h1 class="page-title">🔗  LangChain</h1>
<p class="page-subtitle">Endpoint: POST /langchain-agent  •  Tool-using LangChain agent</p>

<div class="chat-window" id="chat-window">
  <div class="chat-bubble bot-msg">🔗 LangChain ready. Ask me anything 🚀</div>
</div>
<div class="chat-input-row">
  <input type="text" id="chat-input" placeholder="Type your message…" onkeydown="if(event.key==='Enter')sendChat()">
  <button onclick="sendChat()">Send</button>
</div>

<script>
const ENDPOINT = "/langchain-agent";
const AGENT_NAME = "LangChain";
const history = [];

function render(){
  const win = document.getElementById("chat-window");
  if(history.length === 0){
    win.innerHTML = `<div class="chat-bubble bot-msg">🔗 LangChain ready. Ask me anything 🚀</div>`;
  } else {
    win.innerHTML = history.map(h=>`<div class="chat-bubble ${h.role}-msg">${h.text}</div>`).join("");
  }
  win.scrollTop = win.scrollHeight;
}

async function sendChat(){
  const input = document.getElementById("chat-input");
  const msg = input.value.trim();
  if(!msg) return;
  history.push({role:"user", text:msg});
  render();
  input.value = "";
  /* ---- REAL BACKEND CALL ----
  const res = await fetch(ENDPOINT, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message:msg})});
  const json = await res.json();
  const reply = json.answer || json.response;
  ---------------------------- */
  setTimeout(()=>{
    const reply = `🔗 (${AGENT_NAME} demo) You said: "${msg}". Connect ${ENDPOINT} for real answers.`;
    history.push({role:"bot", text:reply});
    render();
  }, 400);
}
</script>
</div>
</body>
</html>
