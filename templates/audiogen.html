<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Generation · MarketPulse AI</title>
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<div class="navbar">
  <a class="brand" href="index.html">📈 MarketPulse AI</a>
  <div class="nav-links">
    <a class="nav-btn active" href="index.html">General</a>
    <a class="nav-btn" href="comparison.html">Comparison</a>
    <a class="nav-btn" href="agent.html">Agent</a>
  </div>
</div>
<div class="container">
<a class="back-btn" href="index.html">← Back to Models</a>
<h1 class="page-title">🔊  Audio Generation</h1>
<p class="page-subtitle">Endpoint: POST /generate-audio  •  Use case: Text → Speech / Audio</p>
<div class="card">
  <div class="section-title">Input</div>
      <div class="form-group"><label class="form-label">text</label><textarea class="form-textarea" id="in-text"></textarea></div>
      <button class="submit-btn" onclick="runModel()">Generate</button>
</div>
<div class="card">
  <div class="section-title">Output</div>
  <div class="output-card" id="model-output">Result will appear here…</div>
</div>
<script>
const ENDPOINT = "/generate-audio";

async function runModel() {
  const out = document.getElementById("model-output");
  const text = document.getElementById("in-text").value.trim();

  if (!text) {
    out.textContent =
      "Please enter text before generating audio.";

    return;
  }

  out.textContent = "⏳ Generating audio...";

  try {
    const response = await fetch(ENDPOINT, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        text: text,
        language: "en"
      })
    });

    const json = await response.json();

    if (!response.ok) {
      throw new Error(
        json.detail ||
        json.message ||
        "Audio generation failed."
      );
    }

    if (!json.audio_url) {
      throw new Error(
        "The backend did not return an audio URL."
      );
    }

    out.innerHTML = "";

    const resultContainer =
      document.createElement("div");

    // Text
    const textLine = document.createElement("div");
    const textLabel = document.createElement("strong");

    textLabel.textContent = "Text: ";
    textLine.appendChild(textLabel);
    textLine.appendChild(
      document.createTextNode(text)
    );

    resultContainer.appendChild(textLine);

    // Language
    const languageLine =
      document.createElement("div");

    const languageLabel =
      document.createElement("strong");

    languageLabel.textContent = "Language: ";

    languageLine.appendChild(languageLabel);

    languageLine.appendChild(
      document.createTextNode(json.language || "en")
    );

    resultContainer.appendChild(languageLine);

    // Filename
    const fileLine = document.createElement("div");
    const fileLabel = document.createElement("strong");

    fileLabel.textContent = "File: ";
    fileLine.appendChild(fileLabel);

    fileLine.appendChild(
      document.createTextNode(json.filename)
    );

    resultContainer.appendChild(fileLine);

    // Create playable audio control
    const audioPlayer =
      document.createElement("audio");

    audioPlayer.controls = true;
    audioPlayer.preload = "metadata";
    audioPlayer.src = json.audio_url;

    audioPlayer.style.display = "block";
    audioPlayer.style.width = "100%";
    audioPlayer.style.maxWidth = "600px";
    audioPlayer.style.marginTop = "15px";

    resultContainer.appendChild(audioPlayer);

    
    out.appendChild(resultContainer);

    // Fetch audio metadata and prepare playback
    audioPlayer.load();

  } catch (error) {
    console.error(
      "Audio generation error:",
      error
    );

    out.textContent =
      "❌ Error: " + error.message;
  }
}
</script>
</div>
</body>
</html>
