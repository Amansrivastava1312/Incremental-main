<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Generation · MarketPulse AI</title>
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<div class="navbar">
  <a class="brand" href="index.html">📈 MarketPulse AI</a>
  <div class="nav-links">
    <a class="nav-btn active" href="index.html">General</a>
    <a class="nav-btn" href="comparison.html">Comparison</a>
    <a class="nav-btn" href="agent.html">Agent</a>
  </div>
</div>
<div class="container">
<a class="back-btn" href="index.html">← Back to Models</a>
<h1 class="page-title">🔊  Audio Generation</h1>
<p class="page-subtitle">Endpoint: POST /generate-audio  •  Use case: Text → Speech / Audio</p>
<div class="card">
  <div class="section-title">Input</div>
      <div class="form-group"><label class="form-label">text</label><textarea class="form-textarea" id="in-text"></textarea></div>
      <button class="submit-btn" onclick="runModel()">Predict</button>
</div>
<div class="card">
  <div class="section-title">Output</div>
  <div class="output-card" id="model-output">Result will appear here…</div>
</div>
<script>
const ENDPOINT = "/generate-audio";

async function runModel() {
  const out = document.getElementById("model-output");
  const text = document.getElementById("in-text").value.trim();

  if (!text) {
    out.textContent = "Please enter text before generating audio.";
    return;
  }

  out.textContent = "⏳ Generating audio...";

  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: text,
        language: "en"
      })
    });

    const json = await res.json();

    if (!res.ok) {
      throw new Error(
        json.detail ||
        json.message ||
        "Audio generation failed."
      );
    }

    if (!json.audio_url) {
      throw new Error(
        "The backend did not return an audio URL."
      );
    }

    out.innerHTML = `
      <div>
        <div>
          <strong>Text:</strong> ${escapeHtml(text)}
        </div>

        <div>
          <strong>Language:</strong>
          ${escapeHtml(json.language)}
        </div>

        <div>
          <strong>File:</strong>
          ${escapeHtml(json.filename)}
        </div>

        ${encodeURI(json.audio_url)}
          Your browser does not support audio playback.
        </audio>

        ${encodeURI(json.audio_url)}
          Download Audio
        </a>
      </div>
    `;

  } catch (error) {
    console.error("Audio generation error:", error);
    out.textContent = "❌ Error: " + error.message;
  }
}

function escapeHtml(value) {
  const element = document.createElement("div");
  element.textContent = String(value);
  return element.innerHTML;
}
</script>
</div>
</body>
</html>
