<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Detection · MarketPulse AI</title>
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<div class="navbar">
  <a class="brand" href="index.html">📈 MarketPulse AI</a>
  <div class="nav-links">
    html">General</a>
    <a class="nav-btn" href="comparison.html">Comparison</a>
    <a class="nav-btn" href="agent.html">Agent</a>
  </div>
</div>
<div class="container">
<a class="back-btn" href="index.html">← Back to Models</a>
<h1 class="page-title">🎯  Object Detection</h1>
<p class="page-subtitle">Endpoint: POST /detect-object  •  Use case: Locate objects in image</p>
<div class="card">
  <div class="section-title">Input</div>
  <div class="form-group"><label class="form-label">image</label><input type="file" class="form-input" id="in-image" accept="image/*"></div>
  <button class="submit-btn" onclick="runModel()">Predict</button>
</div>
<div class="card">
  <div class="section-title">Output</div>
  <div class="output-card" id="model-output">Result will appear here…</div>
</div>
<script>
const ENDPOINT = "/detect-object";

async function runModel(){
  const out = document.getElementById("model-output");
  const fileInput = document.getElementById("in-image");

  if(!fileInput.files[0]){
    out.textContent = "⚠️ Please choose an image first.";
    return;
  }

  out.textContent = "⏳ Sending request to " + ENDPOINT + " …";

  const formData = new FormData();
  formData.append("image", fileInput.files[0]);

  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      body: formData
    });

    const json = await res.json();

    if(json.status !== "success"){
      out.textContent = "❌ Error: " + (json.message || "Detection failed.");
      return;
    }

    // build a small table of object counts
    let rows = "";
    const counts = json.object_counts || {};
    const names = Object.keys(counts);

    if(names.length === 0){
      rows = "<tr><td colspan='2'>No objects detected.</td></tr>";
    } else {
      for(const name of names){
        rows += "<tr><td>" + name + "</td><td>" + counts[name] + "</td></tr>";
      }
    }

    out.innerHTML =
      "<p><b>Image:</b> " + json.image_name + "</p>" +
      "<p><b>Total Objects:</b> " + json.total_objects + "</p>" +
      "<table class='result-table'>" +
        "<tr><th>Object</th><th>Count</th></tr>" +
        rows +
      "</table>" +
      "<img src='" + json.image_url + "' alt='Detected image' " +
        "style='width:100%; max-width:500px; height:auto; margin-top:12px; border-radius:8px; display:block;'>";

  } catch(err) {
    out.textContent = "❌ Error: " + err.message;
  }
}
</script>
</div>
</body>
</html>
