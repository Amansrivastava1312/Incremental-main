<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot · MarketPulse AI</title>
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<div class="navbar">
  <a class="brand" href="index.html">📈 MarketPulse AI</a>
  <div class="nav-links">
    <a class="nav-btn" href="index.html">General</a>
    <a class="nav-btn" href="comparison.html">Comparison</a>
    <a class="nav-btn active" href="agent.html">Agent</a>
  </div>
</div>
<div class="container">
<a class="back-btn" href="agent.html">← Back to Agents</a>
<h1 class="page-title">🤖  Chatbot</h1>
<p class="page-subtitle">Endpoint: POST /chatbot  •  RAG-based document Q&A chatbot</p>

<div class="chat-window" id="chat-window">
  <div class="chat-bubble bot-msg">🤖 Chatbot ready. Ask me anything 🚀</div>
</div>
<div class="chat-input-row">
  <input type="text" id="chat-input" placeholder="Type your message…" onkeydown="if(event.key==='Enter')sendChat()">
  <button onclick="sendChat()">Send</button>
</div>

<script>
const ENDPOINT = "/chatbot";
const history = [];

function render() {
  const win = document.getElementById("chat-window");

  if (history.length === 0) {
    win.innerHTML = `
      <div class="chat-bubble bot-msg">
        🤖 Chatbot ready. Ask me anything 🚀
      </div>
    `;
  } else {
    win.innerHTML = "";

    history.forEach(item => {
      const bubble = document.createElement("div");

      bubble.className =
        "chat-bubble " + item.role + "-msg";

      bubble.textContent = item.text;

      win.appendChild(bubble);
    });
  }

  win.scrollTop = win.scrollHeight;
}


async function sendChat() {
  const input = document.getElementById("chat-input");
  const message = input.value.trim();

  if (!message) {
    return;
  }

  history.push({
    role: "user",
    text: message
  });

  input.value = "";
  input.disabled = true;

  render();

  history.push({
    role: "bot",
    text: "🤖 Thinking..."
  });

  render();

  try {
    const response = await fetch(ENDPOINT, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    const result = await response.json();

    // Remove the temporary "Thinking..." message
    history.pop();

    if (!response.ok) {
      throw new Error(
        result.detail ||
        result.message ||
        "Chatbot request failed."
      );
    }

    if (!result.answer) {
      throw new Error(
        "The chatbot returned an empty answer."
      );
    }

    history.push({
      role: "bot",
      text: "🤖 " + result.answer
    });

  } catch (error) {
    console.error("Chatbot error:", error);

    // Remove "Thinking..." if it still exists
    const lastMessage = history[history.length - 1];

    if (
      lastMessage &&
      lastMessage.role === "bot" &&
      lastMessage.text === "🤖 Thinking..."
    ) {
      history.pop();
    }

    history.push({
      role: "bot",
      text: "❌ Error: " + error.message
    });

  } finally {
    input.disabled = false;
    input.focus();
    render();
  }
}
</script>
</div>
</body>
</html>
